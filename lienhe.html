<main class="container">
    <h1>Liên hệ với chúng tôi</h1>

    <form onsubmit="guiLienHe(event)" class="form-box">
        <label>Họ và tên *</label>
        <input type="text" id="lienHeTen" placeholder="Nhập họ và tên">

        <label>Email *</label>
        <input type="email" id="lienHeEmail" placeholder="example@gmail.com">

        <label>Nội dung *</label>
        <textarea id="noiDung" placeholder="Nhập nội dung cần liên hệ"></textarea>

        <button type="submit">Gửi liên hệ</button>
        <p id="lienHeBao" class="success"></p>
    </form>

    <div class="contact">
        <p><b>Email:</b> cvstudent@gmail.com</p>
        <p><b>Điện thoại:</b> 0123 456 789</p>
    </div>
