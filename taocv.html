<main class="container">
    <h1>Tạo CV</h1>

    <p class="center">
        Nhập thông tin của bạn để chuẩn bị nội dung CV.
    </p>

    <form onsubmit="taoCV(event)">

        <div class="form-group">
            <label>Họ và tên <span>*</span></label>
            <input type="text" id="hoTen" placeholder="Nhập họ và tên">
            <small id="hoTenError"></small>
        </div>

        <div class="form-group">
            <label>Email <span>*</span></label>
            <input type="text" id="email" placeholder="example@gmail.com">
            <small id="emailError"></small>
        </div>

        <div class="form-group">
            <label>Số điện thoại <span>*</span></label>
            <input type="text" id="sdt" placeholder="0123456789">
            <small id="sdtError"></small>
        </div>

        <div class="form-group">
            <label>Ngày sinh <span>*</span></label>
            <input type="date" id="ngaySinh">
            <small id="ngaySinhError"></small>
        </div>

        <div class="form-group">
            <label>Địa chỉ <span>*</span></label>
            <input type="text" id="diaChi" placeholder="Nhập địa chỉ">
            <small id="diaChiError"></small>
        </div>

        <div class="form-group">
            <label>Mục tiêu nghề nghiệp <span>*</span></label>
            <textarea id="mucTieu"></textarea>
            <small id="mucTieuError"></small>
        </div>

        <div class="form-group">
            <label>Học vấn <span>*</span></label>
            <textarea id="hocVan"></textarea>
            <small id="hocVanError"></small>
        </div>

        <button type="submit" class="submit-btn">
            Tạo CV
        </button>

        <p id="cvSuccess"></p>

    </form>
</main>

    <!-- FOOTER -->
